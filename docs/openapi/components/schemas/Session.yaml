type: object
description: |
  Sesión iniciada con `POST /auth/login`. El refresh token **no** viaja en el
  cuerpo: se emite en la cookie `refresh_token`.
required:
  - accessToken
  - tokenType
  - expiresIn
  - user
properties:
  accessToken:
    type: string
    description: Token de acceso (JWT) para el encabezado `Authorization`.
    examples:
      - eyJhbGciOi...
  tokenType:
    type: string
    enum:
      - Bearer
  expiresIn:
    type: integer
    description: Vigencia del token de acceso, en segundos.
    examples:
      - 900
  user:
    $ref: ./User.yaml
