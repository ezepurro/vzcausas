type: object
description: |
  Modelo formal del estudio: un escrito tipo `.docx` (HU34). Un modelo para
  varios fueros es **un solo modelo** con un solo archivo (D-55). El archivo no
  viaja en el recurso: se guarda en `/VZ Causas/Modelos formales`.
required:
  - id
  - name
  - jurisdictions
  - fileName
  - copyToNewCases
  - lastVersionAt
  - lastVersionBy
  - usageCount
  - active
properties:
  id:
    type: integer
    example: 4
  name:
    type: string
    maxLength: 150
    description: Único, sin distinguir mayúsculas (D-71).
    example: Recurso de casación
  jurisdictions:
    type: array
    minItems: 1
    uniqueItems: true
    description: Fueros a los que aplica.
    items:
      $ref: ./Jurisdiction.yaml
    example:
      - CRIMINAL
  fileName:
    type: string
    example: casacion.docx
  copyToNewCases:
    type: boolean
    description: Si se copia a la carpeta de las causas nuevas de sus fueros (HU40).
    example: true
  lastVersionAt:
    type: string
    format: date-time
    description: Fecha y hora de la última versión del archivo. En esta versión, la del alta.
    example: '2026-09-15T16:05:00-03:00'
  lastVersionBy:
    $ref: ./UserSummary.yaml
  usageCount:
    type: integer
    minimum: 0
    description: Causas a cuya carpeta se copió el modelo. Calculado, solo lectura.
    example: 0
  active:
    type: boolean
    description: Vale siempre `true` en esta versión.
    example: true
