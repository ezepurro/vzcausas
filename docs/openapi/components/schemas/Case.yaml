type: object
description: |
  Causa. Es el mismo recurso en el listado, en el detalle, en la respuesta del
  alta, en la de la modificación y en la de `POST /cases/{caseId}/prescription`.

  **Datos propios de cada fuero** (D-67). Un dato que no corresponde al fuero
  de la causa vale `null`. Se cargan en el alta y se modifican con
  `PATCH /cases/{caseId}` (HU19).

  | Fuero            | Datos                                                                                     |
  | ---------------- | ----------------------------------------------------------------------------------------- |
  | `CRIMINAL`       | `clientDetained`                                                                          |
  | `AMPARO`         | `injunctionGranted`, `harmfulActDate`, `harmfulActRenews`, `harmfulActRenewalDays`, `harmfulActTermDays`, `harmfulActTermDayType` y el calculado `harmfulActDeadline` |
  | `ADMINISTRATIVE` | `administrativeRemedyExhaustedOn`                                                         |
  | Los tres         | `courtFeePaid`                                                                            |

  **Prescripción:** solo se computa en el fuero `CRIMINAL`, y una causa penal
  sin calificación legal no prescribe (D-74). Cada calificación computa la
  suya desde `prescriptionStartsOn`: la fecha del acto interruptivo más
  reciente o, si no hay ninguno, la fecha del hecho (`offenseDate`). La que
  rige la causa —la que prescribe primero— llega resuelta en `prescription`.
  `startDate` no interviene.
required:
  - id
  - sacNumber
  - caption
  - court
  - jurisdiction
  - proceduralRole
  - instructorName
  - tribunalPhone
  - instructorExtension
  - counterparty
  - subjectMatter
  - clientDetained
  - injunctionGranted
  - harmfulActDate
  - harmfulActRenews
  - harmfulActRenewalDays
  - harmfulActTermDays
  - harmfulActTermDayType
  - harmfulActDeadline
  - administrativeRemedyExhaustedOn
  - courtFeePaid
  - client
  - responsibleLawyer
  - legalQualifications
  - prescription
  - prescriptionDeclaration
  - startDate
  - currentState
  - folder
  - active
properties:
  id:
    type: integer
    description: Identificador único interno.
    examples:
      - 1
  sacNumber:
    type:
      - string
      - 'null'
    pattern: '^[0-9]{8}$'
    description: |
      Número de SAC, 8 dígitos. Opcional; si se informa, es único entre las
      causas vigentes (RN2). El de una causa dada de baja se puede volver a
      usar (D-97).
    examples:
      - '13284571'
  caption:
    type: string
    description: Carátula, el texto de los autos. Es el recuadro "Autos" de la hoja de carátula.
    examples:
      - GÓMEZ, Ariel Fernando p.s.a. Robo calificado
  court:
    type:
      - string
      - 'null'
    description: |
      Órgano interviniente (antes "Tribunal o dependencia"). Solo cambia el
      rótulo: el campo es el mismo (D-91).
    examples:
      - Juzgado de Control N° 3 · Córdoba
  jurisdiction:
    description: |
      Fuero. Define el ciclo de vida y la tabla de plazos aplicable. No se
      modifica (D-95).
    allOf:
      - $ref: ./Jurisdiction.yaml
  proceduralRole:
    $ref: ./ProceduralRole.yaml
  instructorName:
    type:
      - string
      - 'null'
    description: |
      Instructor de la causa, quien lleva la instrucción en el tribunal o la
      dependencia. Es también el secretario/a del órgano que imprime la hoja
      de carátula (D-91).
    examples:
      - Dra. Verónica Ledesma
  tribunalPhone:
    type:
      - string
      - 'null'
    description: Teléfono del instructor. Texto libre.
    examples:
      - 0351 448-1200
  instructorExtension:
    type:
      - string
      - 'null'
    description: Número de interno del instructor. Texto libre.
    examples:
      - '214'
  counterparty:
    type:
      - string
      - 'null'
    description: Contraparte u organismo. Solo en `ADMINISTRATIVE` y `AMPARO`; en `CRIMINAL` vale `null`.
    examples:
      - null
  subjectMatter:
    type:
      - string
      - 'null'
    description: |
      Objeto del reclamo (`ADMINISTRATIVE`) u objeto del amparo (`AMPARO`).
      En `CRIMINAL` vale `null`.
    examples:
      - null
  clientDetained:
    type:
      - boolean
      - 'null'
    description: Si el cliente está preso. Solo en `CRIMINAL`, sea defensa o querellante (D-80); en los demás fueros vale `null`.
    examples:
      - false
  injunctionGranted:
    type:
      - boolean
      - 'null'
    description: Si el juez hizo lugar a la medida cautelar. Solo en `AMPARO`; en los demás fueros vale `null`.
    examples:
      - null
  harmfulActDate:
    type:
      - string
      - 'null'
    format: date
    description: |
      Fecha del acto lesivo: el objeto del amparo (`subjectMatter`). Solo en
      `AMPARO`; `null` si no se informó o en los demás fueros.
    examples:
      - null
  harmfulActRenews:
    type:
      - boolean
      - 'null'
    description: Si el acto lesivo se renueva. Solo en `AMPARO`; en los demás fueros vale `null`.
    examples:
      - null
  harmfulActRenewalDays:
    type:
      - integer
      - 'null'
    minimum: 1
    description: |
      Cada cuántos días corridos se renueva el acto lesivo. Solo si
      `harmfulActRenews` es `true`; si no, `null`.
    examples:
      - null
  harmfulActTermDays:
    type:
      - integer
      - 'null'
    minimum: 1
    description: |
      Plazo para presentar el amparo desde el acto lesivo, en días. Solo en
      `AMPARO` con `harmfulActDate`; si no, `null`.
    examples:
      - null
  harmfulActTermDayType:
    type:
      - string
      - 'null'
    enum:
      - BUSINESS
      - CONSECUTIVE
      - null
    description: |
      Cómo se cuentan los días de `harmfulActTermDays` (ver `DayType`). Solo
      en `AMPARO` con `harmfulActDate`; si no, `null`.
    examples:
      - null
  harmfulActDeadline:
    description: |
      Vencimiento para presentar el amparo, calculado (D-78). `null` fuera del
      fuero `AMPARO`, cuando no se cargó `harmfulActDate`, **en cuanto la
      causa sale del estado inicial** (el primer acto procesal indica que el
      amparo ya se presentó) y en una causa que no está activa.
    oneOf:
      - $ref: ./HarmfulActDeadline.yaml
      - type: 'null'
  administrativeRemedyExhaustedOn:
    type:
      - string
      - 'null'
    format: date
    description: |
      Fecha de agotamiento de la vía administrativa. Solo en
      `ADMINISTRATIVE`; `null` mientras no se agotó o en los demás fueros.
    examples:
      - null
  courtFeePaid:
    type: boolean
    description: Si se pagó la tasa de justicia (RN10). En los tres fueros.
    examples:
      - false
  client:
    $ref: ./ClientSummary.yaml
  responsibleLawyer:
    $ref: ./LawyerSummary.yaml
  legalQualifications:
    type: array
    description: |
      Calificaciones legales, cada una con su fecha del hecho y su
      prescripción. Opcional en `CRIMINAL`; vacío en los demás fueros. Una
      calificación dada de baja sigue apareciendo en las causas que la
      registran.
    items:
      $ref: ./CaseLegalQualification.yaml
  prescription:
    description: |
      Prescripción que rige la causa (D-51). `null` en `ADMINISTRATIVE` y
      `AMPARO` y en una causa penal sin calificaciones. En una causa
      prescripta se sigue devolviendo como dato histórico.
    oneOf:
      - $ref: ./Prescription.yaml
      - type: 'null'
  prescriptionDeclaration:
    description: Constancia de que la causa fue marcada como prescripta (HU33). `null` mientras no lo fue.
    oneOf:
      - $ref: ./PrescriptionDeclaration.yaml
      - type: 'null'
  startDate:
    type:
      - string
      - 'null'
    format: date
    description: |
      Fecha de inicio de la causa en sede judicial. Vale `null` mientras la
      causa no tiene número de SAC (D-38). No interviene en el cómputo de la
      prescripción.
    examples:
      - '2021-03-12'
  currentState:
    $ref: ./CurrentState.yaml
  folder:
    description: |
      Carpeta de la causa en la nube (HU39, HU40). `null` en las causas
      registradas antes de que existiera la carpeta; con `status` en `PENDING` si se registró sin
      pedirla.
    oneOf:
      - $ref: ./CaseFolder.yaml
      - type: 'null'
  active:
    type: boolean
    description: |
      Estado de alta. Vale siempre `true`: una causa dada de baja no se
      devuelve (HU21, D-97). También vale `true` en una causa marcada como
      prescripta, que no se da de baja.
    examples:
      - true
