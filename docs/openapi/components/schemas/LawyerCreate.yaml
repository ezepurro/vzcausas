type: object
additionalProperties: false
required:
  - lastName
  - firstName
  - registrationNumber
properties:
  lastName:
    type: string
    minLength: 1
    maxLength: 100
    examples:
      - Peralta
  firstName:
    type: string
    minLength: 1
    maxLength: 100
    description: Sin el tratamiento ("Dr.", "Dra.").
    examples:
      - Ignacio
  registrationNumber:
    type: string
    description: Formato `1-28114`. Única.
    pattern: '^[0-9]+-[0-9]+$'
    examples:
      - 1-35207
