type: object
additionalProperties: false
required:
  - lastName
  - firstName
properties:
  lastName:
    type: string
    minLength: 1
    maxLength: 100
    examples:
      - Peralta
  firstName:
    type: string
    minLength: 1
    maxLength: 100
    description: Sin el tratamiento ("Dr.", "Dra.").
    examples:
      - Ignacio
  registrationNumber:
    type:
      - string
      - 'null'
    description: |
      Formato `1-28114`. Única. Opcional: si no se envía, vacía o `null`, el
      abogado queda sin matrícula (Revisión del 05/11/2026, D-107.)
    pattern: '^([0-9]+-[0-9]+)?$'
    examples:
      - 1-35207
