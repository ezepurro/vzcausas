type: object
description: |
  Datos del cliente que se incluyen en la causa (tarjeta "Cliente" del
  detalle), con el mismo significado que en `Client`.
required:
  - id
  - lastName
  - firstName
  - documentType
  - documentNumber
  - address
  - phone
  - email
  - clientSince
properties:
  id:
    type: integer
    examples:
      - 1
  lastName:
    type: string
    examples:
      - GÓMEZ
  firstName:
    type: string
    examples:
      - Ariel Fernando
  documentType:
    $ref: ./DocumentType.yaml
  documentNumber:
    type: string
    description: |
      Número de documento, con el formato de `documentType`. Único por tipo
      entre los clientes vigentes. Reemplaza a `dni` (Revisión del 05/11/2026, D-108.)
    pattern: '^([0-9]{7,8}|[A-Z0-9]{6,20})$'
    examples:
      - '34812905'
  address:
    type:
      - string
      - 'null'
    maxLength: 255
    description: Dirección. Texto libre (Revisión del 05/11/2026, D-108.)
    examples:
      - Av. Colón 1250, Córdoba
  phone:
    type:
      - string
      - 'null'
    examples:
      - 351 415-2288
  email:
    type:
      - string
      - 'null'
    format: email
    examples:
      - afgomez@gmail.com
  clientSince:
    type: string
    format: date
    examples:
      - '2021-03-12'
