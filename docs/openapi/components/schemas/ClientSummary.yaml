type: object
description: |
  Datos del cliente que se incluyen en la causa (tarjeta "Cliente" del
  detalle), con el mismo significado que en `Client`.
required:
  - id
  - lastName
  - firstName
  - dni
  - phone
  - email
  - clientSince
properties:
  id:
    type: integer
    examples:
      - 1
  lastName:
    type: string
    examples:
      - GÓMEZ
  firstName:
    type: string
    examples:
      - Ariel Fernando
  dni:
    type: string
    pattern: '^[0-9]{7,8}$'
    examples:
      - '34812905'
  phone:
    type:
      - string
      - 'null'
    examples:
      - 351 415-2288
  email:
    type:
      - string
      - 'null'
    format: email
    examples:
      - afgomez@gmail.com
  clientSince:
    type: string
    format: date
    examples:
      - '2021-03-12'
