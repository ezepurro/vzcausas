type: object
description: |
  Cliente del estudio. Apellido y nombres viajan en campos separados; la forma
  `GÓMEZ, Ariel Fernando` la compone el cliente.
required:
  - id
  - lastName
  - firstName
  - documentType
  - documentNumber
  - address
  - phone
  - email
  - clientSince
  - activeCases
  - active
properties:
  id:
    type: integer
    description: Identificador único.
    examples:
      - 1
  lastName:
    type: string
    description: Apellido.
    examples:
      - GÓMEZ
  firstName:
    type: string
    description: Nombres.
    examples:
      - Ariel Fernando
  documentType:
    $ref: ./DocumentType.yaml
  documentNumber:
    type: string
    description: |
      Número de documento, con el formato de `documentType`. Único por tipo
      entre los clientes vigentes. Reemplaza a `dni` (Revisión del 05/11/2026, D-108.)
    pattern: '^([0-9]{7,8}|[A-Z0-9]{6,20})$'
    examples:
      - '34812905'
  address:
    type:
      - string
      - 'null'
    maxLength: 255
    description: Dirección. Texto libre (Revisión del 05/11/2026, D-108.)
    examples:
      - Av. Colón 1250, Córdoba
  phone:
    type:
      - string
      - 'null'
    description: Teléfono de contacto. Texto libre.
    examples:
      - 351 415-2288
  email:
    type:
      - string
      - 'null'
    format: email
    description: Correo electrónico.
    examples:
      - afgomez@gmail.com
  clientSince:
    type: string
    format: date
    readOnly: true
    description: Fecha de alta del cliente en el estudio. La asigna el backend.
    examples:
      - '2021-03-12'
  activeCases:
    type: integer
    minimum: 0
    readOnly: true
    description: Causas activas en las que es cliente. Calculado, sólo lectura.
    examples:
      - 1
  active:
    type: boolean
    description: Estado de alta. Vale siempre `true`.
    examples:
      - true
