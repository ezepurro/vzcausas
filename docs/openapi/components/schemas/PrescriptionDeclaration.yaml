type: object
description: |
  Constancia de que la causa fue marcada como prescripta (HU33). Queda cargada
  con `POST /cases/{caseId}/prescription`; antes, el `prescriptionDeclaration`
  de la causa vale `null`.
required:
  - prescriptionDate
  - resolution
  - grounds
  - registeredBy
  - registeredAt
properties:
  prescriptionDate:
    type: string
    format: date
    description: Fecha de la prescripción.
    examples:
      - '2026-09-15'
  resolution:
    type: string
    description: Resolución que la declara.
    examples:
      - Sentencia N° 214 del Juzgado de Control N° 3
  grounds:
    type:
      - string
      - 'null'
    description: Fundamento. Opcional.
    examples:
      - Transcurrió el plazo del art. 62 inc. 2 CP sin actos interruptivos.
  registeredBy:
    $ref: ./UserSummary.yaml
  registeredAt:
    type: string
    format: date-time
    description: Fecha y hora del registro.
    examples:
      - '2026-09-15T12:20:00-03:00'
