type: object
description: |
  Constancia de que la causa fue marcada como prescripta (HU33). Mismos campos
  que el `prescriptionDeclaration` de la causa (contrato V4 §3.7).
required:
  - prescriptionDate
  - resolution
  - grounds
  - registeredBy
  - registeredAt
properties:
  prescriptionDate:
    type: string
    format: date
    description: Fecha de la prescripción.
    examples:
      - '2026-09-30'
  resolution:
    type: string
    description: Resolución que la declara.
    examples:
      - Auto N° 123
  grounds:
    type:
      - string
      - 'null'
    description: Fundamento. Opcional.
  registeredBy:
    $ref: ./UserSummary.yaml
  registeredAt:
    type: string
    format: date-time
    description: Fecha y hora del registro.
    examples:
      - '2026-09-30T15:00:00-03:00'
