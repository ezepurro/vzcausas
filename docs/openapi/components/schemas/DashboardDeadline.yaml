type: object
description: |
  Un vencimiento abierto. Por ahora solo el plazo de un acto procesal: el del
  acto lesivo del amparo (`HARMFUL_ACT`) llega cuando se implemente
  `harmfulActDeadline` (D-78).
required:
  - caseId
  - kind
  - sacNumber
  - caption
  - jurisdiction
  - currentStateName
  - responsibleLawyer
  - dueDate
  - businessDaysRemaining
properties:
  caseId:
    type: integer
  kind:
    type: string
    enum:
      - PROCEDURAL_ACT
      - HARMFUL_ACT
  sacNumber:
    type:
      - string
      - 'null'
  caption:
    type: string
  jurisdiction:
    $ref: ./Jurisdiction.yaml
  currentStateName:
    type: string
  responsibleLawyer:
    $ref: ./UserSummary.yaml
  dueDate:
    type: string
    format: date
  businessDaysRemaining:
    type: integer
    description: Días hábiles hasta el vencimiento. 0, hoy; negativo, vencido.
