type: object
description: '"Mi día", el tablero del abogado (HU41, V4 §3.11).'
required:
  - date
  - lawyer
  - summary
  - deadlines
  - prescriptionAlerts
  - casesToAdvance
properties:
  date:
    type: string
    format: date
    description: Fecha del día en Córdoba, contra la que se calculó todo.
  lawyer:
    $ref: ./UserSummary.yaml
  summary:
    $ref: ./DashboardSummary.yaml
  deadlines:
    type: array
    description: Sus plazos abiertos, por urgencia (`dueDate` ascendente).
    items:
      $ref: ./DashboardDeadline.yaml
  prescriptionAlerts:
    type: array
    description: |
      Sus causas penales con el 70 % o más del plazo de prescripción
      transcurrido (HU32), ordenadas por `expiresOn` ascendente: primero la
      que prescribe antes. Vacía si ninguna llegó al umbral.
    items:
      $ref: ./PrescriptionAlert.yaml
  casesToAdvance:
    type: array
    description: |
      Sus causas activas sin vencimiento abierto. Primero las que no tienen
      actos; después, las que llevan más tiempo sin movimiento.
    items:
      $ref: ./CaseToAdvance.yaml
