type: object
additionalProperties: false
required:
  - currentPassword
  - newPassword
properties:
  currentPassword:
    type: string
    format: password
    minLength: 1
    examples:
      - passwordActual
  newPassword:
    type: string
    format: password
    description: Mínimo 8 caracteres, con al menos un número.
    minLength: 8
    pattern: '[0-9]'
    examples:
      - nuevaPassword1
