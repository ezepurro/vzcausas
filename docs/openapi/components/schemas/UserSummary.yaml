type: object
description: |
  Referencia reducida a un usuario: el abogado que registró un acto procesal.
  Apellido y nombres van por separado desde V4.
required:
  - id
  - lastName
  - firstName
properties:
  id:
    type: integer
    examples:
      - 3
  lastName:
    type: string
    examples:
      - Ríos
  firstName:
    type: string
    examples:
      - Malena
