type: string
description: |
  Fuero. Define el ciclo de vida de la causa y la tabla de plazos aplicable.

  | Código           | Rótulo         |
  | ---------------- | -------------- |
  | `CRIMINAL`       | Penal          |
  | `ADMINISTRATIVE` | Administrativo |
  | `AMPARO`         | Amparo         |

  `AMPARO` conserva su denominación en castellano por tratarse de una figura
  del derecho argentino sin equivalente en inglés.
enum:
  - CRIMINAL
  - ADMINISTRATIVE
  - AMPARO
