type: object
description: Calificación legal registrada en una causa, con su prescripción.
required:
  - id
  - name
  - prescriptionMonths
  - offenseDate
  - prescriptionStartsOn
  - prescriptionExpiresOn
  - elapsedPercentage
  - alert
  - expired
properties:
  id:
    type: integer
    description: Identificador de la calificación legal.
    examples:
      - 1
  name:
    type: string
    description: Denominación vigente de la calificación.
    examples:
      - Robo calificado — art. 167 inc. 2 CP
  prescriptionMonths:
    type: integer
    description: Plazo de prescripción vigente, en meses.
    examples:
      - 96
  offenseDate:
    type: string
    format: date
    description: Fecha del hecho imputado bajo esta calificación. La carga el usuario.
    examples:
      - '2021-02-27'
  prescriptionStartsOn:
    type: string
    format: date
    readOnly: true
    description: |
      Fecha desde la que se computa la prescripción. Calculado: la fecha del
      acto interruptivo más reciente de la causa (HU31, RN8) o, si no hay
      ninguno, `offenseDate`.
    examples:
      - '2024-07-04'
  prescriptionExpiresOn:
    type: string
    format: date
    readOnly: true
    description: '`prescriptionStartsOn` más `prescriptionMonths`. Calculado.'
    examples:
      - '2032-07-04'
  elapsedPercentage:
    type: integer
    minimum: 0
    maximum: 100
    readOnly: true
    description: |
      **(Revisión del 08/11/2026, D-112)** Porcentaje del plazo de esta
      calificación ya transcurrido: días corridos desde `prescriptionStartsOn`
      hasta hoy, sobre los días corridos entre `prescriptionStartsOn` y
      `prescriptionExpiresOn`. Redondeado al entero más cercano. Misma regla
      que `Prescription.elapsedPercentage`. Calculado.
    examples:
      - 27
  alert:
    type: boolean
    readOnly: true
    description: |
      **(Revisión del 08/11/2026, D-112)** `true` si transcurrió el **70 %** o
      más del plazo de esta calificación, evaluado sobre el valor exacto.
      Calculado.
    examples:
      - false
  expired:
    type: boolean
    readOnly: true
    description: |
      **(Revisión del 08/11/2026, D-112)** `true` si hoy es igual o posterior a
      `prescriptionExpiresOn`: el plazo de esta calificación se cumplió. No
      cambia cuál rige la causa (`Prescription`) ni su estado. Calculado.
    examples:
      - false
