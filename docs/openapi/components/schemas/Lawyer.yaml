type: object
description: Abogado del estudio.
required:
  - id
  - fullName
  - registrationNumber
  - activeCases
  - active
properties:
  id:
    type: integer
    description: Identificador único.
    examples:
      - 4
  fullName:
    type: string
    description: Nombre y apellido en un único campo, incluyendo el tratamiento.
    examples:
      - Dr. Ignacio Peralta
  registrationNumber:
    type: string
    description: |
      Matrícula. Única. Formato del Colegio de Abogados de Córdoba:
      circunscripción y número separados por guión.
    examples:
      - 1-35207
  activeCases:
    type: integer
    minimum: 0
    readOnly: true
    description: Causas activas en las que es responsable. Calculado, sólo lectura.
    examples:
      - 16
  active:
    type: boolean
    description: Estado de alta. Vale siempre `true`; ver `DELETE /lawyers/{lawyerId}`.
    examples:
      - true
