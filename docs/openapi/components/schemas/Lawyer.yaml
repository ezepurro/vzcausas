type: object
description: |
  Abogado del estudio. Apellido y nombres viajan por separado desde V4 (D-68);
  el tratamiento ("Dr.", "Dra.") no forma parte del nombre: lo pone el
  frontend (D-81).
required:
  - id
  - lastName
  - firstName
  - registrationNumber
  - activeCases
  - active
properties:
  id:
    type: integer
    description: Identificador único.
    examples:
      - 4
  lastName:
    type: string
    description: Apellido.
    examples:
      - Peralta
  firstName:
    type: string
    description: Nombres, sin el tratamiento.
    examples:
      - Ignacio
  registrationNumber:
    type:
      - string
      - 'null'
    description: |
      Matrícula. Única entre los abogados que la tienen. Formato del Colegio
      de Abogados de Córdoba: circunscripción y número separados por guión.
      `null` si no se cargó (Revisión del 05/11/2026, D-107.)
    examples:
      - 1-35207
  activeCases:
    type: integer
    minimum: 0
    readOnly: true
    description: Causas activas en las que es responsable. Calculado, sólo lectura.
    examples:
      - 16
  active:
    type: boolean
    description: Estado de alta. Vale siempre `true`; ver `DELETE /lawyers/{lawyerId}`.
    examples:
      - true
