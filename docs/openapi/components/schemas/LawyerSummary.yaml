type: object
description: Referencia reducida a un abogado.
required:
  - id
  - fullName
  - registrationNumber
properties:
  id:
    type: integer
    examples:
      - 4
  fullName:
    type: string
    description: Nombre y apellido en un único campo, incluyendo el tratamiento.
    examples:
      - Dr. Ignacio Peralta
  registrationNumber:
    type: string
    description: Matrícula, con el formato del Colegio de Abogados de Córdoba.
    examples:
      - 1-35207
