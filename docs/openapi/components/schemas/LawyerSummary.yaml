type: object
description: Referencia reducida a un abogado. Apellido y nombres van por separado desde V4.
required:
  - id
  - lastName
  - firstName
  - registrationNumber
properties:
  id:
    type: integer
    examples:
      - 4
  lastName:
    type: string
    examples:
      - Peralta
  firstName:
    type: string
    description: Nombres, sin el tratamiento.
    examples:
      - Ignacio
  registrationNumber:
    type: string
    description: Matrícula, con el formato del Colegio de Abogados de Córdoba.
    examples:
      - 1-35207
