type: object
description: |
  Todos los campos son opcionales, aunque debe enviarse al menos uno.
  `activeCases` no es modificable: lo calcula el backend.
additionalProperties: false
minProperties: 1
properties:
  lastName:
    type: string
    minLength: 1
    maxLength: 100
    examples:
      - Peralta
  firstName:
    type: string
    minLength: 1
    maxLength: 100
    examples:
      - Ignacio
  registrationNumber:
    type: string
    description: Formato `1-28114`. Única.
    pattern: '^[0-9]+-[0-9]+$'
    examples:
      - 1-35207
