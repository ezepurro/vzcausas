type: object
additionalProperties: false
required:
  - lastName
  - firstName
  - documentType
  - documentNumber
  - address
  - phone
properties:
  lastName:
    type: string
    minLength: 1
    maxLength: 100
    examples:
      - BENÍTEZ
  firstName:
    type: string
    minLength: 1
    maxLength: 100
    examples:
      - Rodrigo E.
  documentType:
    $ref: ./DocumentType.yaml
  documentNumber:
    type: string
    description: |
      Con el formato de `documentType`: el DNI sin puntos, el pasaporte en
      mayúsculas y sin espacios. Único por tipo entre los clientes vigentes (Revisión del 05/11/2026, D-108.)
    pattern: '^([0-9]{7,8}|[A-Z0-9]{6,20})$'
    examples:
      - '31556208'
  address:
    type: string
    minLength: 1
    maxLength: 255
    pattern: '\S'
    description: |
      Dirección. Texto libre, obligatoria y no vacía
      (Revisión del 05/11/2026, D-108; obligatoria desde la revisión del 06/11/2026, D-109.)
    examples:
      - Av. Rafael Núñez 4560, Córdoba
  phone:
    type: string
    minLength: 1
    maxLength: 50
    pattern: '\S'
    description: |
      Teléfono de contacto. Texto libre, obligatorio y no vacío
      (Revisión del 06/11/2026, D-109.)
    examples:
      - 351 401-5573
  email:
    type: string
    format: email
    examples:
      - rbenitez@gmail.com
