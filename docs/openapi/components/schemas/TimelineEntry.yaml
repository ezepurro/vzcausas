description: |
  Una entrada de la línea de vida de la causa (HU27, D-85). Cada una lleva el
  recurso tal como lo define su propia sección del contrato.
oneOf:
  - type: object
    title: Acto procesal
    additionalProperties: false
    required:
      - type
      - date
      - current
      - proceduralAct
    properties:
      type:
        const: PROCEDURAL_ACT
      date:
        type: string
        format: date
        description: La `actDate` del acto.
      current:
        type: boolean
        description: |
          `true` en el acto que llevó la causa a su estado actual: su plazo es
          el abierto. Los plazos de los demás actos están cerrados.
      proceduralAct:
        $ref: ./ProceduralAct.yaml
  - type: object
    title: Acto interruptivo
    additionalProperties: false
    required:
      - type
      - date
      - governsPrescription
      - interruptiveAct
    properties:
      type:
        const: INTERRUPTIVE_ACT
      date:
        type: string
        format: date
        description: La `actDate` del acto.
      governsPrescription:
        type: boolean
        description: |
          `true` en el acto interruptivo desde el que corre `prescription` de
          la causa: el que fija su `lastInterruptiveActDate`. **(Revisión del
          08/11/2026, D-113)** Un acto posterior al vencimiento de una
          calificación no la reinicia, así que el más reciente no siempre rige.
          En una causa sin calificaciones no hay `prescription`: ningún acto
          rige.
      interruptiveAct:
        $ref: ./InterruptiveAct.yaml
  - type: object
    title: Calificación declarada prescripta
    description: '**(Revisión del 08/11/2026, D-113)** Una por calificación declarada.'
    additionalProperties: false
    required:
      - type
      - date
      - legalQualification
      - prescriptionDeclaration
    properties:
      type:
        const: QUALIFICATION_PRESCRIPTION_DECLARATION
      date:
        type: string
        format: date
        description: La `prescriptionDate` de la declaración.
      legalQualification:
        type: object
        additionalProperties: false
        required:
          - id
          - name
        properties:
          id:
            type: integer
          name:
            type: string
      prescriptionDeclaration:
        $ref: ./PrescriptionDeclaration.yaml
  - type: object
    title: Pase a prescripta
    additionalProperties: false
    required:
      - type
      - date
      - prescriptionDeclaration
    properties:
      type:
        const: PRESCRIPTION_DECLARATION
      date:
        type: string
        format: date
        description: La `prescriptionDate` de la declaración.
      prescriptionDeclaration:
        $ref: ./PrescriptionDeclaration.yaml
