components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: Token de acceso obtenido en `POST /auth/login` o `POST /auth/refresh`.
        refreshTokenCookie:
            type: apiKey
            in: cookie
            name: refresh_token
            description: |
                Refresh token opaco, emitido en una cookie `HttpOnly` restringida a
                `Path=/api/v1/auth`. Solo lo usa `POST /auth/refresh`.
