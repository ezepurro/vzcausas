post:
  tags:
    - Auth
  operationId: logout
  summary: Cerrar sesión
  description: |
    Finaliza la sesión del usuario autenticado. Tanto el refresh como el
    access token dejan de aceptarse desde la próxima petición. No afecta a
    otras sesiones concurrentes del mismo usuario en otros dispositivos.

    **Rol requerido:** cualquier usuario autenticado.
  responses:
    '204':
      description: Sesión cerrada. La respuesta no contiene cuerpo.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
