get:
  tags:
    - Reports
  operationId: getMonthlyReport
  summary: Reporte mensual de gestión
  description: |
    Obtiene los datos del reporte mensual de un período (HU43, V6 §3.13): los
    indicadores, los gráficos de la pantalla "Reportes" y las cifras del PDF.
    El backend calcula y el cliente muestra.

    Un mes cerrado (`CLOSED`) sale de la foto que se tomó al cerrarlo y no
    cambia; el mes en curso (`IN_PROGRESS`) se calcula en cada pedido. Hay
    reportes desde `availableFrom` hasta `currentPeriod`. Sin versiones (D-117).

    **Rol requerido:** `ADMINISTRATOR`.
  parameters:
    - name: period
      in: query
      required: false
      description: Mes del reporte, `AAAA-MM`. Por defecto, el último mes cerrado; si no hay ninguno, el mes en curso.
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        examples:
          - '2026-08'
  responses:
    '200':
      description: El reporte del período. Ver V6 §3.13 para cada campo.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - period
                  - status
                  - dataAsOf
                  - takenAt
                  - availableFrom
                  - currentPeriod
                  - summary
                  - byJurisdiction
                  - lawyers
                  - monthly
                  - proceduralStates
                  - prescription
                  - deadlines
                properties:
                  period:
                    type: string
                  status:
                    type: string
                    enum: [CLOSED, IN_PROGRESS]
                  dataAsOf:
                    type: string
                    format: date
                  takenAt:
                    type: string
                    format: date-time
                  availableFrom:
                    type: string
                  currentPeriod:
                    type: string
                  summary:
                    type: object
                  byJurisdiction:
                    type: array
                    items:
                      type: object
                  lawyers:
                    type: array
                    items:
                      type: object
                  monthly:
                    type: array
                    items:
                      type: object
                  proceduralStates:
                    type: array
                    items:
                      type: object
                  prescription:
                    type: object
                  deadlines:
                    type: object
    '400':
      description: El período no tiene la forma `AAAA-MM`.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: INVALID_REQUEST
              message: Parámetros de query inválidos.
              details:
                period: Debe tener el formato AAAA-MM.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/ForbiddenAdministrator.yaml
    '404':
      description: El período es anterior a `availableFrom` o posterior al mes en curso.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: MONTHLY_REPORT_NOT_FOUND
              message: No hay reporte para ese período.
              details: null
