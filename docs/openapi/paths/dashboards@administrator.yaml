get:
  tags:
    - Dashboards
  operationId: getAdministratorDashboard
  summary: Tablero del administrador
  description: |
    Obtiene el tablero del administrador: "Estudio" (HU42), con todas las
    causas activas del estudio y el responsable de cada una. Es un modelo de
    lectura, calculado en cada petición.

    No recibe parámetros: el filtro por abogado ("Tocá un abogado para ver
    solo sus vencimientos") y el filtro por urgencia los aplica el cliente
    sobre `deadlines`, que trae el responsable de cada plazo.

    **Rol requerido:** `ADMINISTRATOR`.
  responses:
    '200':
      description: |
        Tablero del administrador, calculado para el martes 15/09/2026. El
        ejemplo está recortado: `deadlines` muestra tres de los cinco plazos
        abiertos de los datos del prototipo, y `team`, tres de los siete
        abogados.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/AdministratorDashboard.yaml
          example:
            data:
              date: '2026-09-15'
              summary:
                dueToday: 1
                overdue: 1
                dueSoon: 2
                activeCases: 105
              casesByJurisdiction:
                - jurisdiction: CRIMINAL
