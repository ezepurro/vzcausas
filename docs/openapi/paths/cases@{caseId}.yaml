get:
  tags:
    - Cases
  operationId: getCase
  summary: Consultar detalle de causa
  description: |
    Obtiene el detalle de una causa (HU22). Devuelve el mismo recurso que el
    listado: encabezado, barra de prescripción (`prescription`), tarjeta del
    cliente y acceso a la carpeta (`folder.url`, botón "Abrir carpeta en
    Drive").

    El **ciclo de vida** sale de `GET /cases/{caseId}/timeline` (HU27, D-85),
    que devuelve ya intercaladas y completas sus tres fuentes. El resto del
    detalle:

    | Elemento del detalle | Endpoint | HU |
    | -------------------- | -------- | -- |
    | Línea "Secretario/a" del encabezado | `instructorName` en este recurso | 24 |
    | "Modificar causa" | `PATCH /cases/{caseId}` | 19 |
    | "Dar de baja" | `DELETE /cases/{caseId}` | 21 |
    | Tarjeta "Documentación" | `GET /cases/{caseId}/documents` | 38 |
    | "Generar expediente" | `POST /cases/{caseId}/case-files`, con la vista previa de `GET /cases/{caseId}/cover` | 25, 24 |
    | "Modificar" en un acto del ciclo de vida | `PATCH /cases/{caseId}/procedural-acts/{actId}` | 28 |

    "Registrar pago de tasa" y "Anular" un acto están fuera del contrato.

    **Rol requerido:** cualquier usuario autenticado.
  responses:
    '200':
      description: |
        Causa solicitada. Es la causa del prototipo: el hecho es del
        27/02/2021, pero el acto interruptivo del 04/07/2024 reinició el
        cómputo, y por eso la prescripción corre desde esa fecha y vence el
        04/07/2032.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/Case.yaml
          example:
            data:
              id: 1
              sacNumber: '13284571'
              caption: GÓMEZ, Ariel Fernando p.s.a. Robo calificado
              court: Juzgado de Control N° 3 · Córdoba
              jurisdiction: CRIMINAL
