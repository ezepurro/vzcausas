patch:
  tags:
    - Cases
  operationId: updateCase
  summary: Modificar causa
  description: |
    Corrige los datos de una causa vigente (HU19). Cualquier perfil puede,
    sea o no el abogado responsable. Responde la causa completa, igual que
    `GET /cases/{caseId}`.

    Cada cambio queda auditado (usuario, fecha y qué campos), sin endpoint de
    consulta. Si cambia la carátula o el responsable y la causa tiene su
    carpeta creada, la carpeta se renombra o se mueve en Drive (D-104); si
    Drive no responde, la causa se guarda igual y `folder.path` informa la
    ubicación real.

    **Rol requerido:** quien opera la causa (D-110): el abogado responsable,
    un `ADMINISTRATOR` o una `SECRETARY`. Un usuario cuyo único rol es `LAWYER`
    y que no es el responsable recibe `403`, después del `404`.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CaseUpdate.yaml
        example:
          caption: FERREYRA, Lucas Martín p.s.a. Robo calificado
  responses:
    '200':
      description: La causa modificada.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/Case.yaml
    '400':
      description: Datos inválidos, campo no modificable, cuerpo vacío o identificador inválido.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            withoutSac:
              summary: Fecha de inicio sin SAC
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos.
                  details:
                    startDate: Sin número de SAC la causa no tiene fecha de inicio.
            jurisdiction:
              summary: El fuero no se modifica (D-95)
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos.
                  details:
                    jurisdiction: El fuero de una causa no se puede modificar.
            invalidCaseId:
              $ref: ../components/examples/InvalidCaseIdError.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      description: |
        Un usuario cuyo único rol operativo es `LAWYER` y que no es el abogado responsable de la causa (D-110). `ADMINISTRATOR` y `SECRETARY` operan cualquier causa; con varios roles alcanza con uno. Se evalúa después del `404`.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: FORBIDDEN
              message: Solo el abogado responsable de la causa puede modificarla.
              details: null
    '404':
      $ref: ../components/responses/CaseNotFound.yaml
    '409':
      description: El SAC ya lo tiene otra causa vigente (D-97).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: CASE_SAC_ALREADY_EXISTS
              message: Ya existe una causa registrada con ese número de SAC.
              details: null
    '422':
      description: |
        Calificaciones en una causa "Prescripta" (D-96), o quitar o cambiar la
        fecha del hecho de una calificación declarada prescripta (D-113).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            terminalState:
              summary: Calificaciones de una causa "Prescripta"
              value:
                error:
                  code: CASE_IN_TERMINAL_STATE
                  message: La causa se encuentra en un estado terminal y no admite esta operación.
                  details: null
            prescribedQualification:
              summary: Calificación declarada prescripta (D-113)
              value:
                error:
                  code: LEGAL_QUALIFICATION_ALREADY_PRESCRIBED
                  message: No se puede quitar ni modificar una calificación legal declarada prescripta.
                  details: null
delete:
  tags:
    - Cases
  operationId: deactivateCase
  summary: Dar de baja causa
  description: |
    Da de baja una causa (HU21), para retirar registros incorrectos o
    duplicados. La baja es lógica (RN12): la causa se conserva con sus actos,
    actos interruptivos y expedientes, en cualquier estado, terminales
    incluidos.

    **Para el cliente la causa deja de existir** (D-97): `GET /cases/{caseId}`
    y sus subrecursos responden `404 CASE_NOT_FOUND`, no aparece en
    `GET /cases` y deja de contar en `activeCases`, tableros y proceso diario.
    No hay reactivación por la API. Su SAC queda libre para otra causa.

    La carpeta en Drive se mueve a la carpeta `Papelera` (`/VZ Causas/Papelera/`),
    con lo que tiene adentro (D-104, revisión del 08/11/2026): no se borra ni se
    purga, y una persona puede devolverla a mano. `Papelera` se crea la primera
    vez que hace falta. Si Drive no responde, la baja no falla y la carpeta
    queda como estaba. El motivo, el
    usuario y la fecha quedan registrados, sin endpoint de consulta.

    **Rol requerido:** quien opera la causa (D-110): el abogado responsable,
    un `ADMINISTRATOR` o una `SECRETARY`. Un usuario cuyo único rol es `LAWYER`
    y que no es el responsable recibe `403`, después del `404`.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CaseDeactivation.yaml
        example:
          reason: 'Causa duplicada: se registró dos veces con distinto SAC.'
  responses:
    '204':
      description: Causa dada de baja. La respuesta no contiene cuerpo.
    '400':
      description: Motivo de más de 500 caracteres, campo no admitido o identificador inválido.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            reasonTooLong:
              summary: Motivo de más de 500 caracteres
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos.
                  details:
                    reason: Debe tener hasta 500 caracteres.
            invalidCaseId:
              $ref: ../components/examples/InvalidCaseIdError.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      description: |
        Un usuario cuyo único rol operativo es `LAWYER` y que no es el abogado responsable de la causa (D-110). `ADMINISTRATOR` y `SECRETARY` operan cualquier causa; con varios roles alcanza con uno. Se evalúa después del `404`.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: FORBIDDEN
              message: Solo el abogado responsable de la causa puede darla de baja.
              details: null
    '404':
      $ref: ../components/responses/CaseNotFound.yaml
