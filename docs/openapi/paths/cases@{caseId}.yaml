              injunctionGranted: null
              harmfulActDate: null
              harmfulActRenews: null
              harmfulActRenewalDays: null
              harmfulActTermDays: null
              harmfulActTermDayType: null
              harmfulActDeadline: null
              administrativeRemedyExhaustedOn: null
              courtFeePaid: false
              client:
