get:
  tags:
    - Cases
  operationId: getCase
  summary: Consultar detalle de causa
  description: |
    Obtiene el detalle de una causa (HU22). Devuelve el mismo recurso que el
    listado: encabezado, barra de prescripción (`prescription`), tarjeta del
    cliente y acceso a la carpeta (`folder.url`, botón "Abrir carpeta en
    Drive").

    El **ciclo de vida** sale de `GET /cases/{caseId}/timeline` (HU27, D-85),
    que devuelve ya intercaladas y completas sus tres fuentes. La lista de
    documentos y las acciones "Modificar causa", "Dar de baja", "Emitir
    carátula", "Emitir expediente" y "Registrar pago de tasa" pertenecen a
    sprints posteriores.

    **Rol requerido:** cualquier usuario autenticado.
  responses:
    '200':
      description: |
        Causa solicitada. Es la causa del prototipo: el hecho es del
        27/02/2021, pero el acto interruptivo del 04/07/2024 reinició el
        cómputo, y por eso la prescripción corre desde esa fecha y vence el
        04/07/2032.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/Case.yaml
          example:
            data:
              id: 1
              sacNumber: '13284571'
              caption: GÓMEZ, Ariel Fernando p.s.a. Robo calificado
              court: Juzgado de Control N° 3 · Córdoba
              jurisdiction: CRIMINAL
