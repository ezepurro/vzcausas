parameters:
  - $ref: ../components/parameters/ClientIdParam.yaml

get:
  tags:
    - Clients
  operationId: getClient
  summary: Consultar cliente
  description: |
    Obtiene la información de un cliente específico.

    **Rol requerido:** cualquier usuario autenticado.
  responses:
    '200':
      description: Cliente solicitado.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/Client.yaml
          example:
            data:
              id: 1
              lastName: GÓMEZ
              firstName: Ariel Fernando
              documentType: DNI
              documentNumber: '34812905'
              address: Av. Colón 1250, Córdoba
              phone: 351 415-2288
              email: afgomez@gmail.com
              clientSince: '2021-03-12'
              activeCases: 1
              active: true
    '400':
      description: Identificador inválido.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            invalidClientId:
              $ref: ../components/examples/InvalidClientIdError.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/ClientNotFound.yaml

patch:
  tags:
    - Clients
  operationId: updateClient
  summary: Modificar cliente
  description: |
    Modifica los datos de un cliente (HU10, V6). Los datos se guardan una sola
    vez y las causas los referencian: el cambio se ve en todas sus causas.

    Si cambia el apellido o los nombres, la carátula de cada causa vigente del
    cliente que empieza con `APELLIDO, Nombres` pasa a empezar con el nombre
    nuevo, y su carpeta en Drive se renombra. Si Drive no responde, la
    modificación no falla.

    **Rol requerido:** cualquier usuario autenticado.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ClientUpdate.yaml
        example:
          address: Bv. San Juan 1240, Córdoba
          phone: 351 415-2288
  responses:
    '200':
      description: El cliente modificado, igual que `GET /clients/{clientId}`.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/Client.yaml
    '400':
      description: Datos inválidos, cuerpo vacío, `clientSince` enviado o identificador inválido.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            invalidData:
              summary: Datos inválidos
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos.
                  details:
                    documentNumber: Debe contener 7 u 8 dígitos, sin puntos.
                    address: La dirección es obligatoria.
            invalidClientId:
              $ref: ../components/examples/InvalidClientIdError.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/ClientNotFound.yaml
    '409':
      description: El documento lo tiene otro cliente vigente.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: CLIENT_DNI_ALREADY_EXISTS
              message: Ya existe un cliente registrado con ese DNI.
              details: null

delete:
  tags:
    - Clients
  operationId: deactivateClient
  summary: Dar de baja cliente
  description: |
    Da de baja un cliente (HU11, V6). La baja es lógica (RN12): el cliente se
    conserva, deja de aparecer en el listado, su consulta responde `404` y no
    se puede elegir para una causa nueva. No hay reactivación por la API.

    **Un cliente con causas activas no se da de baja** (D-122): `409`. Las
    causas en estado terminal y las dadas de baja no la impiden, y siguen
    mostrando al cliente en su detalle, sin marca (D-134).

    El documento queda libre para otro cliente. El motivo, el usuario y la
    fecha quedan registrados, sin endpoint para consultarlos.

    **Rol requerido:** cualquier usuario autenticado.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ClientDeactivation.yaml
        example:
          reason: Cliente cargado dos veces.
  responses:
    '204':
      description: Cliente dado de baja. La respuesta no contiene cuerpo.
    '400':
      description: Motivo de más de 500 caracteres, campo no admitido o identificador inválido.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            reasonTooLong:
              summary: Motivo de más de 500 caracteres
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos.
                  details:
                    reason: Debe tener hasta 500 caracteres.
            invalidClientId:
              $ref: ../components/examples/InvalidClientIdError.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/ClientNotFound.yaml
    '409':
      description: El cliente tiene causas activas.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: CLIENT_HAS_ACTIVE_CASES
              message: No se puede dar de baja el cliente porque tiene causas activas.
              details: null
