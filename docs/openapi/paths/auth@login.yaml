post:
  tags:
    - Auth
  operationId: login
  summary: Iniciar sesión
  description: |
    Inicia una sesión utilizando las credenciales del usuario.

    Además del cuerpo, la respuesta emite la cookie `refresh_token`. El objeto
    `user` posee la misma estructura que devuelve `/users`; su `lastLoginAt`
    corresponde al acceso **anterior** al que se está realizando, para que el
    usuario pueda advertir un ingreso que no efectuó.

    Cinco intentos fallidos consecutivos contra el mismo usuario bloquean la
    cuenta con una espera creciente (ver la respuesta `429`). El endpoint
    también tiene un límite de pedidos por dirección IP, más estricto que el
    del resto de la API.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LoginRequest.yaml
  responses:
    '200':
      description: Sesión iniciada.
      headers:
        Set-Cookie:
          $ref: ../components/headers/SetRefreshTokenCookie.yaml
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/Session.yaml
          example:
            data:
              accessToken: eyJhbGciOi...
              tokenType: Bearer
              expiresIn: 900
              user:
                id: 1
                username: fvazquez
                lastName: Vázquez
                firstName: Fernando G.
                email: fvazquez@vazquezzarate.com
                roles:
                  - ADMINISTRATOR
                  - LAWYER
                lawyer:
                  id: 1
                  lastName: Vázquez
                  firstName: Fernando G.
                  registrationNumber: 1-28114
                lastLoginAt: '2026-09-19T08:12:00-03:00'
                active: true
    '400':
      description: Datos inválidos.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: VALIDATION_ERROR
              message: Los datos enviados no son válidos.
              details:
                username: El nombre de usuario es obligatorio.
                password: La contraseña es obligatoria.
    '401':
      description: |
        Credenciales incorrectas. El mismo mensaje exista o no exista el
        usuario: distinguirlos permitiría enumerar cuentas.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: INVALID_CREDENTIALS
              message: Usuario o contraseña incorrectos.
              details: null
    '429':
      description: |
        Dos motivos posibles, con el mismo HTTP pero distinto `code`: el
        bloqueo progresivo por cuenta (`TOO_MANY_LOGIN_ATTEMPTS`), o el
        límite de pedidos por IP, compartido con el resto de la API
        (`TOO_MANY_REQUESTS`).
      headers:
        Retry-After:
          $ref: ../components/headers/RetryAfter.yaml
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            accountLocked:
              summary: Bloqueo por cuenta (5 fallos consecutivos)
              value:
                error:
                  code: TOO_MANY_LOGIN_ATTEMPTS
                  message: Demasiados intentos fallidos. Esperá antes de volver a intentar.
                  details:
                    retryAfterSeconds: 90
            ipThrottled:
              summary: Límite de pedidos por IP
              value:
                error:
                  code: TOO_MANY_REQUESTS
                  message: Demasiadas peticiones. Esperá un momento antes de reintentar.
                  details:
                    retryAfterSeconds: 42
