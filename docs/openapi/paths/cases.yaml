        Si el almacenamiento en la nube no respondió, la causa se registra
        igual y `folder` llega con `status` en `ERROR`, `url` en `null`,
        `templatesCopied` en `0` y los modelos que faltan en
        `templatesPending`. Con `createFolder` en `false`, `folder.status` es
