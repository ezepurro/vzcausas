get:
  tags:
    - Cases
  operationId: listCases
  summary: Consultar causas
  description: |
    Obtiene una lista paginada de las causas (HU20). El buscador del
    encabezado de la aplicación usa este mismo endpoint con `search`. Sin
    filtro de estado incluye también las causas en estados terminales;
    excluye solo las dadas de baja (D-75).

    **Orden:** por urgencia. Primero las causas con vencimiento, por la fecha
    de ese vencimiento ascendente (las vencidas quedan primeras), y luego las
    que no tienen vencimiento, por `id`.

    **Vencimiento de la causa** (D-82). Es el que tenga abierto, de
    cualquiera de los dos orígenes: el plazo del acto procesal del estado
    actual (`currentState.dueDate`) o, en un amparo todavía en "Iniciada", el
    del acto lesivo (`harmfulActDeadline.dueDate`). Nunca hay dos a la vez.
    Lo usan el orden y el filtro `openDeadline`.

    **Filtro de estado procesal.** El desplegable tiene tres grupos y cada uno
    viaja en un parámetro distinto; los tres son **excluyentes** entre sí:

    | Grupo del desplegable                                 | Parámetro                    |
    | ----------------------------------------------------- | ---------------------------- |
    | "Fuero Penal", "Fuero Administrativo", "Fuero Amparo" | `proceduralStateId`          |
    | "Causas nuevas" → "Iniciada"                          | `withoutProceduralActs=true` |
    | "Escritos a mano en causas"                           | `customState`                |

    Una causa marcada como prescripta se encuentra con `proceduralStateId`
    del estado "Prescripta". Un filtro por un abogado o un estado inexistente
    no es un error: devuelve una colección vacía.

    Las vistas de vencimientos y de alertas de prescripción del prototipo se
    sirven desde `/dashboards`, no desde este listado.

    **Rol requerido:** cualquier usuario autenticado.
  parameters:
    - $ref: ../components/parameters/PageParam.yaml
    - $ref: ../components/parameters/LimitParam.yaml
    - name: search
      in: query
      required: false
      description: Filtra por `sacNumber`, por `caption` y por apellido y nombres del cliente.
      schema:
        type: string
    - $ref: ../components/parameters/JurisdictionQueryParam.yaml
    - name: responsibleLawyerId
      in: query
      required: false
      description: Filtro "Todos los responsables".
      schema:
        type: integer
    - name: proceduralStateId
      in: query
      required: false
      description: |
        Estado de la tabla, incluido "Prescripta". Excluyente con
        `customState` y `withoutProceduralActs`.
      schema:
        type: integer
    - name: customState
      in: query
      required: false
      description: |
        Estado escrito a mano. Coincidencia exacta sin distinguir mayúsculas.
        Excluyente con `proceduralStateId` y `withoutProceduralActs`.
      schema:
        type: string
    - name: withoutProceduralActs
      in: query
      required: false
      description: |
        `true`: solo causas en el estado inicial "Iniciada"
        (`currentState.initial` en `true`). Combinado con `jurisdiction`
        devuelve las de ese fuero. Excluyente con `proceduralStateId` y
        `customState`.
      schema:
        type: boolean
    - name: clientId
      in: query
      required: false
      description: Causas de un cliente (HU9).
      schema:
        type: integer
    - name: openDeadline
      in: query
      required: false
      description: |
        `true`: solo causas con vencimiento abierto —del acto procesal o del
        acto lesivo (D-82)—, incluidas las vencidas. Botón "Solo con plazo
        por vencer".
      schema:
        type: boolean
  responses:
    '200':
      description: |
        Página de causas. Los valores de `businessDaysRemaining` y
        `elapsedPercentage` del ejemplo corresponden a una consulta del
        martes 15/09/2026.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - pagination
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/Case.yaml
              pagination:
                $ref: ../components/schemas/Pagination.yaml
          example:
            data:
              - id: 2
                sacNumber: '12907344'
                caption: PEREYRA, Marcos D. — Sumario administrativo
