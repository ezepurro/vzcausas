post:
  tags:
    - Cases
  operationId: createCase
  summary: Registrar causa
  description: |
    Registra una nueva causa (HU18) y, si se pide, crea su carpeta en la nube
    (HU39) y copia en ella los modelos del fuero (HU40).

    **Efectos del alta**

    - La causa nace en el estado inicial de su fuero, "Iniciada"
      (`currentState.initial` en `true`). El estado de la tabla lo fija el
      primer acto procesal, así que el alta no depende de que el fuero tenga
      estados cargados.
    - El estado inicial no abre plazo: `currentState.dueDate` vale `null`
      hasta que un acto procesal abra uno.
    - El alta no es un movimiento del ciclo de vida: la línea de tiempo
      empieza con el primer acto procesal.
    - En una causa penal con calificaciones, `prescription` llega calculada
      desde el alta, con `lastInterruptiveActDate` en `null`.
    - **Carpeta en la nube.** Con `createFolder` en `true` (por defecto) el
      backend crea la carpeta y devuelve su situación en `folder`. Con
      `copyTemplates` en `true`, copia en ella los modelos formales vigentes
      del fuero que tienen `copyToNewCases` en `true` e informa cuántos en
      `folder.templatesCopied` ("carpeta creada en Drive con 6 modelos").
    - **La carpeta no condiciona el alta** (D-60). Si el almacenamiento en la
      nube falla, la causa se registra igual: la respuesta es `201` con
      `folder.status` en `ERROR`, y la carpeta se reintenta con
      `POST /cases/{caseId}/folder`. Este endpoint nunca responde `502`.

    **Rol requerido:** cualquier usuario autenticado.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CaseCreate.yaml
        examples:
          criminal:
            summary: Causa penal, con carpeta y modelos
            value:
              sacNumber: '13284571'
              jurisdiction: CRIMINAL
              caption: GÓMEZ, Ariel Fernando p.s.a. Robo calificado
              court: Juzgado de Control N° 3 · Córdoba
              instructorName: Dra. Verónica Ledesma
              tribunalPhone: 0351 448-1200
              instructorExtension: '214'
              clientId: 1
              proceduralRole: DEFENSA
              clientDetained: false
              legalQualifications:
                - legalQualificationId: 1
                  offenseDate: '2021-02-27'
              responsibleLawyerId: 3
              startDate: '2021-03-12'
              courtFeePaid: false
              createFolder: true
              copyTemplates: true
          amparo:
            summary: Amparo, sin carpeta
            value:
              sacNumber: '12774310'
              jurisdiction: AMPARO
              caption: MOYANO, Daniela c/ APROSS — Amparo de salud
              court: Juzgado Civil y Comercial 37ª Nom.
              instructorName: Dra. Inés Ferrero
              tribunalPhone: 0351 448-1600
