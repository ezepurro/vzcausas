parameters:
  - $ref: ../components/parameters/TemplateIdParam.yaml

get:
  tags:
    - Document Templates
  operationId: downloadDocumentTemplate
  summary: Descargar el archivo de un modelo formal
  description: |
    Descarga el `.docx` de un modelo formal, en su última versión (HU35,
    CA-35.6). Es el botón "Descargar" de la lista.

    Es la única respuesta exitosa que **no es JSON**: el cuerpo es el archivo.
    Exige el encabezado `Authorization` como el resto, así que el cliente lo
    pide como cualquier otra petición y entrega el archivo al usuario; no sirve
    como destino directo de un enlace (D-58). Los errores sí son JSON.

    `Content-Disposition` trae el nombre del archivo dos veces: `filename`, sin
    acentos, y `filename*`, en UTF-8 con sus acentos (RFC 6266).

    **Rol requerido:** `ADMINISTRATOR` o `LAWYER`.
  responses:
    '200':
      description: El archivo del modelo.
      headers:
        Content-Disposition:
          description: '`attachment` con el nombre del archivo.'
          schema:
            type: string
          example: attachment; filename="designacion-defensor.docx"; filename*=UTF-8''designaci%C3%B3n-defensor.docx
        Content-Length:
          schema:
            type: integer
          example: 48211
      content:
        application/vnd.openxmlformats-officedocument.wordprocessingml.document:
          schema:
            type: string
            format: binary
    '400':
      description: Identificador inválido.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            invalidTemplateId:
              $ref: ../components/examples/InvalidTemplateIdError.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/ForbiddenTemplates.yaml
    '404':
      $ref: ../components/responses/DocumentTemplateNotFound.yaml
    '502':
      $ref: ../components/responses/DocumentStorageUnavailable.yaml
