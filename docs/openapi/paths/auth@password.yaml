patch:
  tags:
    - Auth
  operationId: changePassword
  summary: Cambiar contraseña
  description: |
    Permite al usuario autenticado modificar su propia contraseña. La sesión
    permanece abierta.

    **Rol requerido:** cualquier usuario autenticado.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ChangePasswordRequest.yaml
  responses:
    '204':
      description: |
        Contraseña modificada. La respuesta no contiene cuerpo. La sesión que
        hizo el cambio permanece abierta; todas las demás sesiones del
        usuario, en cualquier otro dispositivo, se cierran.
    '400':
      description: Datos inválidos.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          examples:
            weakPassword:
              summary: La contraseña nueva no cumple la política
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Los datos enviados no son válidos.
                  details:
                    newPassword: La contraseña no cumple con los requisitos establecidos.
            samePassword:
              summary: La contraseña nueva es igual a la actual
              value:
                error:
                  code: SAME_PASSWORD
                  message: La contraseña nueva debe ser distinta de la actual.
                  details:
                    newPassword: La contraseña nueva debe ser distinta de la actual.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '422':
      description: La contraseña actual no coincide.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: INVALID_CURRENT_PASSWORD
              message: La contraseña actual es incorrecta.
              details: null
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
