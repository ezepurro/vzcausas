patch:
  tags:
    - Auth
  operationId: changePassword
  summary: Cambiar contraseña
  description: |
    Permite al usuario autenticado modificar su propia contraseña. La sesión
    permanece abierta.

    **Rol requerido:** cualquier usuario autenticado.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ChangePasswordRequest.yaml
  responses:
    '204':
      description: Contraseña modificada. La respuesta no contiene cuerpo.
    '400':
      description: Datos inválidos.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: VALIDATION_ERROR
              message: Los datos enviados no son válidos.
              details:
                newPassword: La contraseña no cumple con los requisitos establecidos.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '422':
      description: La contraseña actual no coincide.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error:
              code: INVALID_CURRENT_PASSWORD
              message: La contraseña actual es incorrecta.
              details: null
