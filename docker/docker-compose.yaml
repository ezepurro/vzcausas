name: VZ-causas

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: causas-backend
    environment:
      <<: *database-url
    ports:
      - '3000:3000'
    env_file:
      - ./.env
    restart: 'unless-stopped'
    networks:
      - causas-network
    depends_on:
      postgres:
        condition: service_healthy
      # openapi-build:
      #   condition: service_completed_successfully
      # migrate:
      #   condition: service_completed_successfully
    volumes:
      - ../build:/build:ro
      - ../backend:/app
      - /app/node_modules
    command: npm run start:dev

  postgres:
    container_name: causas-db
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: 'unless-stopped'
    ports:
      - '5432:5432'
    networks:
      - causas-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: causas-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    networks:
      - causas-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: causas-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    restart: 'unless-stopped'
    ports:
      - '5173:5173'
    networks:
      - causas-network
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: causas-migrate
    environment:
      <<: *database-url
    restart: 'no'
    networks:
      - causas-network
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy

  # openapi-build:
  #   build:
  #     context: ../tooling/openapi
  #     dockerfile: Dockerfile
  #   container_name: causas-openapi-build
  #   restart: 'no'
  #   networks:
  #     - causas-network
  #   volumes:
  #     - ../docs/openapi:/docs/openapi:ro
  #     - ../build:/build

  # openapi-docs:
  #   image: nginx:alpine
  #   container_name: causas-openapi-docs
  #   ports:
  #     - '8081:80'
  #   networks:
  #     - causas-network
  #   depends_on:
  #     openapi-build:
  #       condition: service_completed_successfully
  #   volumes:
  #     - ../build:/usr/share/nginx/html:ro

networks:
  causas-network:
    driver: bridge

volumes:
  postgres_dev_data:
