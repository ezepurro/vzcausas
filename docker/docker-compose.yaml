name: VZ-causas

x-database-url: &database-url
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
    backend:
        build:
            context: ../backend
            dockerfile: Dockerfile
            target: development
        # Nombre explícito para que migrate reutilice esta misma imagen.
        image: vz-causas-backend
        container_name: causas-backend
        environment:
            <<: *database-url
            # Los contenedores que crea Testcontainers se alcanzan vía el host.
            TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
            # El código está montado desde el disco de Windows: los cambios que
            # se hacen en el host no le llegan al contenedor como eventos de
            # archivo (inotify), y el watch de tsc nunca se entera. Con estas
            # dos, TypeScript revisa los archivos por intervalo. La primera
            # cubre los archivos editados; la segunda, los creados o borrados.
            TSC_WATCHFILE: DynamicPriorityPolling
            TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
        ports:
            - "3000:3000"
        env_file:
            - ./.env
        restart: "unless-stopped"
        networks:
            - causas-network
        depends_on:
            postgres:
                condition: service_healthy
            # openapi-build:
            #   condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully
        volumes:
            - ../build:/build:ro
            - ../backend:/app
            - /app/node_modules
            # dist en un volumen y no en el bind mount: escribir los ~400 archivos
            # que emite tsc sobre el disco de Windows llevaba ~15 s por arranque;
            # en el volumen, ~7. Además el .tsbuildinfo sobrevive entre arranques
            # y la compilación incremental funciona.
            - /app/dist
            # Testcontainers: permite que `make test-int` levante la base de test
            # desde dentro del contenedor usando el Docker del host.
            - /var/run/docker.sock:/var/run/docker.sock
        # Sin prisma generate: migrate lo corre justo antes sobre el mismo mount.
        # nest-cli.dev.json apaga deleteOutDir, que no puede borrar /app/dist
        # porque es un punto de montaje (EBUSY).
        command: npx nest start --watch --config nest-cli.dev.json
        # El contenedor está "up" desde que arranca el shell, pero Nest tarda
        # bastante más en escuchar: la compilación de TS sobre el bind mount. Sin esto el frontend proxea contra un puerto cerrado y
        # devuelve 502, que se lee como un error del backend en vez de como
        # "todavía no terminó de arrancar".
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3000/api/v1/health/db || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 90s
            # Durante el start_period chequea cada 1 s en vez de cada 5 s, así no
            # queda "unhealthy" varios segundos después de que Nest ya escucha.
            start_interval: 1s

    postgres:
        container_name: causas-db
        build:
            context: ./postgres
            dockerfile: Dockerfile
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        restart: "unless-stopped"
        ports:
            - "5432:5432"
        networks:
            - causas-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
            # Durante el arranque chequea cada 1 s: los servicios que esperan a la
            # base arrancan apenas acepta conexiones, no hasta 10 s después.
            start_interval: 1s
        volumes:
            - postgres_dev_data:/var/lib/postgresql/data

    # Perfil "tools": no arranca con make dev-up, sino con make tools-up.
    adminer:
        profiles: ["tools"]
        image: adminer:latest
        container_name: causas-adminer
        restart: unless-stopped
        ports:
            - "8080:8080"
        networks:
            - causas-network
        depends_on:
            postgres:
                condition: service_healthy

    frontend:
        container_name: causas-frontend
        build:
            context: ../frontend
            dockerfile: Dockerfile
            target: development
        restart: "unless-stopped"
        # Solo las VITE_*, no un env_file completo: Vite expone al bundle del
        # navegador cualquier variable con ese prefijo, y el contenedor del
        # frontend no tiene por qué recibir POSTGRES_PASSWORD, JWT_ACCESS_SECRET
        # ni DEV_SEED_PASSWORD.
        environment:
            # Destino del proxy de vite.config.ts. En la red de compose el backend
            # se llama "backend"; el fallback del archivo es localhost:3000, que
            # dentro de este contenedor no atiende nadie y devuelve 502.
            VITE_BACKEND_URL: http://backend:3000
            # El backend monta todo bajo el prefijo global api/v1. Sin esto,
            # http.ts arma las URLs con "/api" y el proxy las reenvía tal cual a
            # una ruta que no existe.
            VITE_API_URL: /api/v1
            VITE_USE_MOCKS: ${VITE_USE_MOCKS}
            # Atajo local de la campana (features/deadlines/CAMBIOS.md). Este servicio
            # corre sólo en desarrollo y el código lo lee únicamente con DEV.
            VITE_INTERNAL_TRIGGER_SECRET: ${INTERNAL_TRIGGER_SECRET}
            # La lee vite.config.ts para revisar los archivos por intervalo:
            # montados desde el disco de Windows, los cambios no le llegan a
            # Vite como eventos. Sin prefijo VITE_ a propósito: con ese
            # prefijo, Vite la expondría al bundle del navegador.
            WATCH_POLLING: "true"
        ports:
            - "5173:5173"
        networks:
            - causas-network
        # service_healthy y no la forma corta: esta última solo espera a que el
        # contenedor arranque, y el frontend quedaba sirviendo mientras Nest
        # todavía compilaba.
        depends_on:
            backend:
                condition: service_healthy
        volumes:
            - ../frontend:/app
            - /app/node_modules

    migrate:
        # Sin build propio: usa la imagen del backend. Construirla aparte era
        # una segunda copia idéntica de ~1,3 GB y un build más en cada dev-build.
        image: vz-causas-backend
        pull_policy: never
        container_name: causas-migrate
        environment:
            <<: *database-url
        # El seed lee DEV_SEED_PASSWORD y BCRYPT_COST; sin esto usa sus
        # fallbacks y los usuarios de prueba quedan con otra contraseña.
        env_file:
            - ./.env
        restart: "no"
        networks:
            - causas-network
        depends_on:
            postgres:
                condition: service_healthy
        # Mismo bind mount que el backend: sin esto corre las migraciones y el
        # seed congelados en la imagen, y una migración nueva no se aplica
        # hasta rebuildear.
        volumes:
            - ../backend:/app
            - /app/node_modules
        # generate primero: el bind mount tapa el cliente generado en el build
        # (src/generated está en .gitignore) y seed.ts lo importa.
        command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed"

    # Valida docs/openapi (Redocly + Spectral), arma el bundle en
    # build/openapi.yaml y termina. Para regenerarlo: make openapi-build.
    # Perfil "tools", como openapi-docs y adminer: make tools-up.
    openapi-build:
        profiles: ["tools"]
        build:
            context: ../tooling/openapi
            dockerfile: Dockerfile
        container_name: causas-openapi-build
        restart: "no"
        networks:
            - causas-network
        volumes:
            - ../docs/openapi:/docs/openapi:ro
            - ../build:/build

    # Swagger UI sobre el bundle. "Try it out" le pega a localhost:3000, así
    # que http://localhost:8081 tiene que estar en CORS_ALLOWED_ORIGINS.
    openapi-docs:
        profiles: ["tools"]
        image: swaggerapi/swagger-ui
        container_name: causas-openapi-docs
        restart: unless-stopped
        environment:
            SWAGGER_JSON: /spec/openapi.yaml
            # Manda la cookie del refresh en las peticiones, para que
            # POST /auth/refresh funcione desde la UI.
            WITH_CREDENTIALS: "true"
            PERSIST_AUTHORIZATION: "true"
        ports:
            - "8081:8080"
        networks:
            - causas-network
        depends_on:
            openapi-build:
                condition: service_completed_successfully
        volumes:
            - ../build:/spec:ro

networks:
    causas-network:
        driver: bridge

volumes:
    postgres_dev_data:
